version: 2
updates:
  # Workflow actions are pinned to commit SHAs. Dependabot updates the SHA and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The engine version is part of every lesson's verified_against, so it
      # is upgraded by hand: bump it, re-run every exercise, then update the
      # lessons (see "Accuracy rules" in CLAUDE.md).
      - dependency-name: "@duckdb/duckdb-wasm"
