name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Frontmatter validation, plus every exercise's reference solution and
      # known-wrong answers, run on the same DuckDB-WASM build the site ships.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds the site and solves one exercise per track with outside network blocked.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
